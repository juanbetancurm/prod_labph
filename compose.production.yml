name: physics-lab

services:
  db:
    image: postgres:16-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-physics_lab}
      POSTGRES_USER: ${POSTGRES_USER:-physics_lab}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.production}
    volumes:
      - physics_pgdata:/var/lib/postgresql/data
    networks:
      - private
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    mem_limit: 768m
    cpus: 0.75
    stop_grace_period: 30s

  migrate:
    image: ${PHYSICS_LAB_IMAGE:-physics-lab-app:local}
    build:
      context: .
      target: production
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env.production}
    command: ["npm", "--workspace", "backend", "run", "db:migrate"]
    depends_on:
      db:
        condition: service_healthy
    networks:
      - private
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: "no"

  app:
    image: ${PHYSICS_LAB_IMAGE:-physics-lab-app:local}
    build:
      context: .
      target: production
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env.production}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-https://physicslab.labolavs.com}
      SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME:-physics_lab_session}
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-12}
    volumes:
      - physics_uploads:/app/backend/uploads/reviews
    networks:
      private:
      web:
        aliases:
          - physics-lab-app
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    expose:
      - "4000"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 512m
    cpus: 0.75
    stop_grace_period: 30s

volumes:
  physics_pgdata:
  physics_uploads:

networks:
  private:
    internal: true
  web:
    external: true
    name: web
